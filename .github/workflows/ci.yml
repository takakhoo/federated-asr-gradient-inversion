name: repository-checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse Python sources
        run: python -m compileall -q src
      - name: Validate runner shell syntax
        run: bash -n run.bash
